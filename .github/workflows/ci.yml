name: CI

on:
  pull_request:
  push:
    branches: [main]

# Single source of truth for the uv pin across all jobs below. The Dockerfile pins the
# same version in its `COPY --from=ghcr.io/astral-sh/uv:<v>` line, which no templating
# can reach — that one still has to be bumped by hand alongside this.
env:
  UV_VERSION: "0.11.30"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dev tools
        # --only-dev skips the runtime tree (asyncpg, psycopg2, telebot, ...), so this
        # installs the dev group (Ruff + pip-audit) and nothing the app needs to run.
        run: uv sync --only-dev --frozen

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

  checks:
    name: Migrations & boot
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Dummy values so consts.py imports cleanly (it coerces several ints at import time).
      DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      DB_POOL_SIZE: "5"
      STATE_STORAGE: memory
      BOT_TOKEN: "0:ci-dummy-token"
      NEWS_CHANNEL_ID: "0"
      FEEDBACK_CHAT_ID: "0"
      EXCEPTION_CHAT_ID: "0"
      ADMIN_IDS: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        # uv provisions CPython 3.12 itself (from requires-python), so no
        # separate actions/setup-python step is needed.
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-dev --frozen

      - name: Apply migrations on a clean DB
        # Mirrors what the Dockerfile runs on every prod boot — a broken or
        # divergent migration here means prod would crash-loop on deploy.
        run: uv run alembic upgrade heads

      - name: Detect un-migrated model changes
        # Fails if models/ drifted from the migrations (forgot to autogenerate).
        # Informational: enum/server-default diffs can be false positives.
        continue-on-error: true
        run: uv run alembic check

      - name: Boot check (import app + register handlers)
        # Catches import errors and the "forgot to import a model in
        # models/__init__.py" footgun flagged in CLAUDE.md.
        run: uv run python -c "import main; print('boot ok')"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dnd_organize_bot:ci .

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Non-blocking: a freshly disclosed transitive CVE should surface in the PR
    # without blocking unrelated changes. Drop continue-on-error to make it a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Export and audit the production tree
        # Audit only the locked prod tree (same target as the old
        # `pip-audit -r requirements.txt`). `uv export` reads uv.lock directly
        # (no install needed); `uvx` runs pip-audit outside the project's venv.
        run: |
          uv export --no-dev --frozen --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt
