[project]
name = "dnd-organize-bot"
version = "0.1.0"
description = "Telegram bot for finding and organizing tabletop RPG games (dnd-hub.ru)"
requires-python = ">=3.12,<4.0"
dependencies = [
    # --- Direct dependencies (imported or invoked by the app) ---
    "fastapi==0.115.4",
    "SQLAlchemy==2.0.36",
    "pyTelegramBotAPI[aiohttp]==4.23.0",
    "python-dotenv==1.0.1",
    "Babel==2.17.0",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "uvicorn==0.32.1",
    "redis==5.2.1",

    # --- Transitive deps, held at their pre-Poetry versions ---
    # This migration is a tooling swap only and must not change any installed
    # version (audit-flagged deps stay deferred until test coverage exists).
    # TEMPORARY: drop this block and loosen the direct pins to ranges in a
    # follow-up PR once tests are in place, so `uv lock --upgrade` can move them.
    "aiohttp==3.10.11",
    "aiohappyeyeballs==2.4.3",
    "aiosignal==1.3.1",
    "annotated-types==0.7.0",
    "anyio==4.6.2.post1",
    "attrs==24.2.0",
    "certifi==2024.8.30",
    "charset-normalizer==3.4.0",
    "frozenlist==1.5.0",
    "greenlet==3.1.1",
    "idna==3.10",
    "Mako==1.3.6",
    "MarkupSafe==3.0.2",
    "multidict==6.1.0",
    "propcache==0.2.0",
    "pydantic==2.9.2",
    "pydantic-core==2.23.4",
    "requests==2.32.3",
    "sniffio==1.3.1",
    "starlette==0.41.2",
    "typing-extensions==4.12.2",
    "urllib3==2.2.3",
    "yarl==1.17.1",
]

# This is an app, not a distributable package: install only the dependencies,
# never the project root itself (equivalent of Poetry's package-mode = false).
[tool.uv]
package = false

[dependency-groups]
# Dev-only tools; excluded from production installs via `uv sync --no-dev`.
dev = [
    "pip-audit",
    "ruff==0.16.3",
]

[tool.ruff]
# `extend-exclude`, not `exclude`: this ADDS to Ruff's built-in excludes (.venv, .git,
# __pycache__, ...) instead of replacing them. alembic/versions is template output, kept
# pristine so a freshly autogenerated migration is CI-green with no format pass.
extend-exclude = ["alembic/versions"]
# Honour that exclusion for explicitly-passed paths too. Without this it applies only to
# directory traversal, so an editor's format-on-save would still rewrite a migration.
force-exclude = true

[tool.ruff.lint]
# `select`, not `extend-select`: Ruff 0.16's built-in default is ~415 rules across ~37
# families and moves between releases, so extending it would pull in new rules — and new
# cleanup work — on every version bump. This list is the whole contract.
#   E4    earns its place for E402 alone; I already splits `import os, sys` (E401).
#   E9    is kept for E902 (an unreadable file must fail, not warn). Syntax errors are
#         reported regardless of what is selected.
#   E501  is deliberately absent: the formatter owns wrapping, and the over-length lines
#         left are f-string literals it cannot split.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Scoped to the files that really are re-export hubs. A blanket "__init__.py" glob also
# disables F401 on the ~18 other __init__.py files — several of which hold real logic
# (handlers/user_profile is 200 lines) — where it was hiding genuinely dead imports.
"models/__init__.py" = ["F403"]                 # star-imports, so Base.registry.configure() sees every model
"handlers/*/form_items/__init__.py" = ["F401"]  # nothing but re-exports
